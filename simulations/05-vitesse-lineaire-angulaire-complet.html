<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitesse linéaire et vitesse angulaire</title>
<style>
  :root{
    --bg:#f1f4fa; --card:#ffffff; --ink:#1d2433; --muted:#5b6475;
    --grid:#cfd6e3; --accent:#2563eb; --accent2:#7c3aed;
    --ok:#15803d; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2;
    --info:#1e40af; --infobg:#dbeafe; --warn:#9a3412; --warnbg:#ffedd5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:10px 18px 4px}
  h1{font-size:1.25em;margin:0}
  .sceneTitle{font-size:.95em;color:var(--muted);margin-top:2px}
  .progress{display:flex;gap:6px;padding:0 18px 10px}
  .progress .seg{flex:1;height:7px;border-radius:4px;background:#dde3ee;cursor:pointer}
  .progress .seg.done{background:#93c5fd}
  .progress .seg.active{background:var(--accent)}

  main{display:grid;grid-template-columns:minmax(0,1.5fr) 400px;gap:16px;padding:0 18px;height:calc(100vh - 150px)}
  .board{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
  svg{width:100%;height:100%;display:block}
  .panelCol{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
  .card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:14px 16px}
  .card h2{font-size:.82em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
  button{font:inherit;border:0;border-radius:12px;padding:9px 12px;cursor:pointer;background:#e7ebf3;color:var(--ink)}
  button:hover{filter:brightness(.96)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button:disabled{opacity:.4;cursor:default}
  .primary{background:var(--accent);color:#fff;font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row > button{flex:1}
  .speedRow button{padding:7px 10px;font-size:.85em}
  .speedRow button.active{background:var(--accent);color:#fff}
  .chrono{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15em;text-align:center;background:var(--infobg);color:var(--info);border-radius:10px;padding:8px;margin-top:10px}
  .toolsRow button{font-size:.88em}
  .toolsRow button.active{background:var(--warn);color:#fff}
  .reveal{margin-top:8px}
  .reveal button{width:100%;text-align:left;background:#eef1f7;font-weight:600}
  .reveal button.open{background:var(--accent);color:#fff}
  .reveal .content{display:none;padding:10px 4px 2px;line-height:1.5}
  .reveal .content.open{display:block}
  .formula{background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px;text-align:center;font-weight:700;font-size:1.15em;margin:6px 0}
  table.mini{width:100%;border-collapse:collapse;font-size:.95em;margin-top:4px}
  table.mini td,table.mini th{padding:4px 6px;text-align:center;border-bottom:1px solid #e9edf4}
  table.mini th{color:var(--muted);font-size:.82em}
  .liverow{display:flex;align-items:center;gap:8px;padding:3px 0;font-variant-numeric:tabular-nums}
  .dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  footer{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px 16px}
  footer .quote{flex:1;text-align:center;color:var(--muted);font-style:italic;font-size:.92em}
  .sliderLine{display:flex;align-items:center;gap:10px;font-weight:600;margin:8px 0}
  .sliderLine input[type=range]{flex:1;accent-color:var(--accent);height:26px}
  .sliderLine .val{min-width:5.6em;text-align:right;font-variant-numeric:tabular-nums}
  .unitTabs button{flex:1;padding:6px 8px;font-size:.85em}
  .unitTabs button.active{background:var(--accent);color:#fff}
  .hide{display:none !important}
  .lbl{font-size:20px;font-weight:700}
  .small{font-size:13px;fill:#94a3b8}
  @media (max-width:980px){
    main{grid-template-columns:1fr;height:auto}
    .board{aspect-ratio:9/10}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Vitesse linéaire et vitesse angulaire</h1>
    <div class="sceneTitle" id="sceneTitle"></div>
  </div>
  <button id="fs" title="Plein écran (F)">⛶ Plein écran</button>
</header>
<div class="progress" id="progress"></div>

<main>
  <div class="board">
    <svg id="svg" viewBox="0 0 900 700" aria-label="Simulation">
      <defs>
        <marker id="arrAxis" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker>
        <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
        <marker id="arrTheta" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
      </defs>
      <g id="board-g"></g>
    </svg>
  </div>

  <div class="panelCol">
    <div class="card">
      <div class="row">
        <button class="primary" id="playBtn">▶ Démarrer</button>
        <button id="resetBtn">↺ Réinitialiser</button>
      </div>
      <div class="row speedRow" id="speedRow" style="margin-top:8px">
        <button data-sp="0.5">0,5×</button>
        <button data-sp="1" class="active">1×</button>
        <button data-sp="2">2×</button>
        <button data-sp="4">4×</button>
      </div>
      <div class="chrono" id="chrono">Δt = 0,0 s</div>
    </div>
    <div id="panels"></div>
  </div>
</main>

<footer>
  <button id="prevBtn">◀ Précédent</button>
  <div class="quote" id="quote"></div>
  <button id="nextBtn">Suivant ▶</button>
</footer>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(x, y, s, attrs, parent) {
  const t = el('text', Object.assign({ x, y }, attrs), parent);
  t.textContent = s;
  return t;
}
function withBg(t, parent, pad = 4) {
  const b = t.getBBox();
  parent.insertBefore(el('rect', { x: b.x - pad, y: b.y - 2, width: b.width + pad * 2, height: b.height + 4, rx: 5, fill: '#fff', opacity: .92 }), t);
}
// Dessine un texte mis en miroir horizontalement autour de x (pour orienter une icône
// qui regarde naturellement à gauche vers le sens du déplacement, à droite).
function mirroredText(x, y, s, attrs, parent) {
  const g = el('g', { transform: `translate(${2 * x},0) scale(-1,1)` }, parent);
  return txt(x, y, s, attrs, g);
}
const fmt = (n, d = 2) => n.toFixed(d).replace('.', ',').replace('-', '−');
function gcdI(a, b) { return b ? gcdI(b, a % b) : a; }
function piFrac(t) {
  const k = Math.round(t / (Math.PI / 12));
  if (Math.abs(t - k * Math.PI / 12) > 1e-6) return null;
  if (k === 0) return '0';
  const g = gcdI(Math.abs(k), 12), num = k / g, den = 12 / g;
  return (num < 0 ? '−' : '') + (Math.abs(num) === 1 ? '' : Math.abs(num)) + 'π' + (den === 1 ? '' : '/' + den);
}
function fmtRad(t, d = 2) { const f = piFrac(t); return f !== null ? f : fmt(t, d); }
function fmtDeg(t) { return Math.round(t * 180 / Math.PI) + '°'; }
function ease(t) { t = Math.max(0, Math.min(1, t)); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

/* ================= Disque partagé (scènes 3 à 6) ================= */
const CX = 450, CY = 260, DPXPM = 170, R_DISK = 1.0, OMEGA = 1.0; // rad/s
const P = (a, r, cx = CX, cy = CY) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
function arcPath(a1, a2, r, cx = CX, cy = CY) {
  const [x1, y1] = P(a1, r, cx, cy), [x2, y2] = P(a2, r, cx, cy);
  const big = Math.abs(a2 - a1) > Math.PI ? 1 : 0, sweep = a2 > a1 ? 0 : 1;
  return `M${x1},${y1} A${r},${r} 0 ${big} ${sweep} ${x2},${y2}`;
}
function drawDiskBase(g, opts = {}) {
  el('circle', { cx: CX, cy: CY, r: R_DISK * DPXPM, fill: '#eef1f7', stroke: '#cbd5e1', 'stroke-width': 2 }, g);
  if (!opts.noArrow) {
    const r = R_DISK * DPXPM + 24;
    const [sx, sy] = P(70 * Math.PI / 180, r), [ex, ey] = P(95 * Math.PI / 180, r);
    el('path', { d: `M${sx},${sy} A${r},${r} 0 0 0 ${ex},${ey}`, stroke: '#64748b', 'stroke-width': 3, fill: 'none', 'marker-end': 'url(#arrAxis)' }, g);
  }
  el('circle', { cx: CX, cy: CY, r: 5, fill: 'var(--ink)' }, g);
  txt(CX - 12, CY + 24, 'O', { class: 'lbl', 'font-style': 'italic', 'text-anchor': 'end' }, g);
}
function drawTrace(g, color, radiusPx, fromTheta, toTheta) {
  const span = toTheta - fromTheta;
  if (span <= 1e-4) return;
  if (span >= 2 * Math.PI - 1e-4) el('circle', { cx: CX, cy: CY, r: radiusPx, fill: 'none', stroke: color, 'stroke-width': 5 }, g);
  else el('path', { d: arcPath(fromTheta, toTheta, radiusPx), stroke: color, 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, g);
}
const COL = { A: '#2563eb', B: '#d97706', C: '#dc2626' };

/* ================= Dérouler un fil : courbe → règle ================= */
// curveFn(sMetres) -> [x,y] sur la vraie trajectoire. Renvoie pos(sMetres), la position
// actuelle (mélangée pendant l'animation), utilisable pour placer marqueurs/objet.
function drawUnrollLane(g, opts) {
  const { curveFn, totalM, unrollT, rulerX0, rulerY, pxPerM, color, draw = true, step = 0.2, labelDy = -16 } = opts;
  const e = ease(unrollT || 0);
  const pos = sM => {
    const cs = Math.max(0, Math.min(totalM, sM));
    const [cx, cy] = curveFn(cs);
    const rx = rulerX0 + cs * pxPerM, ry = rulerY;
    return [cx + (rx - cx) * e, cy + (ry - cy) * e];
  };
  if (draw && totalM > 1e-3) {
    const n = Math.max(2, Math.ceil(totalM / step));
    let d = '';
    for (let i = 0; i <= n; i++) {
      const [x, y] = pos(totalM * i / n);
      d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
    }
    el('path', { d, stroke: color, 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round', opacity: .92 }, g);
    if ((unrollT || 0) > 0.02) {
      const rg = el('g', { opacity: Math.min(1, unrollT * 1.3) }, g);
      el('line', { x1: rulerX0 - 8, y1: rulerY + 14, x2: rulerX0 + totalM * pxPerM + 14, y2: rulerY + 14, stroke: '#cbd5e1', 'stroke-width': 2 }, rg);
      const gstep = totalM > 10 ? 2 : (totalM > 4 ? 1 : 0.5);
      for (let m = 0; m <= totalM + 1e-6; m += gstep) {
        const x = rulerX0 + m * pxPerM;
        el('line', { x1: x, y1: rulerY + 8, x2: x, y2: rulerY + 20, stroke: '#64748b', 'stroke-width': 1.6 }, rg);
        txt(x, rulerY + 34, fmt(m, gstep < 1 ? 1 : 0), { class: 'small', 'text-anchor': 'middle' }, rg);
      }
    }
    if ((unrollT || 0) > 0.85) withBg(txt(rulerX0 + totalM * pxPerM / 2, rulerY + labelDy, `longueur = ${fmt(totalM, 2)} m`, { class: 'lbl', fill: color, 'text-anchor': 'middle', 'font-size': 16 }, g), g);
  }
  return pos;
}

/* ================= Petits composants d'UI réutilisables ================= */
function el2(tag, attrs, parent) {
  const e = document.createElement(tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function buildReveals(container, defs) {
  const card = el2('div', { class: 'card' }, container);
  const h = el2('h2', {}, card); h.textContent = 'Révélations progressives';
  const refs = {};
  defs.forEach(d => {
    const wrap = el2('div', { class: 'reveal' }, card);
    const btn = el2('button', {}, wrap); btn.textContent = '👁 ' + d.label;
    const content = el2('div', { class: 'content' }, wrap);
    btn.addEventListener('click', () => {
      const open = content.classList.toggle('open');
      btn.classList.toggle('open', open);
    });
    refs[d.id] = { content, def: d };
  });
  return refs;
}
function buildTools(container, defs, state) {
  if (!defs.length) return {};
  const card = el2('div', { class: 'card' }, container);
  const h = el2('h2', {}, card); h.textContent = 'Outils';
  const row = el2('div', { class: 'row toolsRow' }, card);
  const refs = {};
  defs.forEach(d => {
    const b = el2('button', {}, row); b.textContent = d.label;
    b.addEventListener('click', () => d.onClick(state));
    refs[d.id] = b;
  });
  return refs;
}

/* ================= SCÈNE 1 — La course ================= */
const TX0 = 110, TX1 = 830, LANE_Y = [150, 350, 550];
const scene1 = {
  title: 'Scène 1 — Trois objets font la course',
  quote: 'Cette méthode fonctionne lorsque la trajectoire est rectiligne. Peut-on utiliser la même méthode lorsque la trajectoire est courbe ?',
  racers: [
    { id: 'A', label: 'Cycliste', emoji: '🚴', color: '#dc2626', d: 20, t: 5 },
    { id: 'B', label: 'Véhicule', emoji: '🚗', color: '#2563eb', d: 20, t: 4 },
    { id: 'C', label: 'Coureur', emoji: '🏃', color: '#15803d', d: 20, t: 2.5 }
  ],
  reveals: [
    { id: 'f', label: 'Révéler la formule de la vitesse moyenne',
      html() { return `<div class="formula">v = d / Δt</div><p>C'est la <b>vitesse moyenne</b> sur le parcours. Ici, elle est aussi <b>constante</b> : le mouvement est rectiligne uniforme.</p>`; } },
    { id: 'c', label: 'Révéler les vitesses calculées',
      html() { return scene1.racers.map(r => `<div>v<sub>${r.id}</sub> = ${r.d} / ${fmt(r.t, 1)} = <b>${fmt(r.d / r.t, 1)} m/s</b></div>`).join(''); } }
  ],
  tools: [],
  initState() { return { simTime: 0, playing: false }; },
  tick(s, dt) {
    s.simTime += dt;
    const finishTime = Math.max(...this.racers.map(r => r.t));
    if (s.simTime >= finishTime) s.playing = false;
  },
  distOf(r, t) { const v = r.d / r.t; return Math.min(r.d, v * t); },
  buildPanel(container, state) {
    state.refs = { reveals: buildReveals(container, this.reveals) };
  },
  renderBoard(s, g) {
    g.innerHTML = '';
    this.racers.forEach((r, i) => {
      const y = LANE_Y[i];
      el('rect', { x: TX0 - 30, y: y - 65, width: TX1 - TX0 + 90, height: 130, fill: i % 2 ? '#f8fafc' : '#ffffff' }, g);
      txt(TX0 - 40, y + 6, r.label + ' (' + r.id + ')', { class: 'small', 'font-size': 15, 'text-anchor': 'end', fill: r.color, 'font-weight': 700 }, g);
      el('line', { x1: TX0, y1: y, x2: TX1, y2: y, stroke: '#cbd5e1', 'stroke-width': 2 }, g);
      el('line', { x1: TX0, y1: y - 46, x2: TX0, y2: y + 46, stroke: '#1d2433', 'stroke-width': 3 }, g);
      el('line', { x1: TX1, y1: y - 46, x2: TX1, y2: y + 46, stroke: '#1d2433', 'stroke-width': 3 }, g);
      const d = this.distOf(r, s.simTime), x = TX0 + (d / r.d) * (TX1 - TX0), done = d >= r.d - 1e-6;
      el('circle', { cx: x, cy: y, r: 20, fill: r.color, opacity: .18 }, g);
      mirroredText(x, y + 9, r.emoji, { 'font-size': 26, 'text-anchor': 'middle' }, g);
      el('circle', { cx: x + 13, cy: y - 13, r: 9, fill: r.color, stroke: '#fff', 'stroke-width': 2 }, g);
      txt(x + 13, y - 10, r.id, { 'font-size': 10, 'font-weight': 800, fill: '#fff', 'text-anchor': 'middle' }, g);
      const timeLbl = done ? '✓ ' + fmt(r.t, 1) + ' s' : '⏱ ' + fmt(Math.min(s.simTime, r.t), 1) + ' s';
      withBg(txt(x, y - 36, timeLbl, { class: 'lbl', fill: done ? 'var(--ok)' : r.color, 'text-anchor': 'middle', 'font-size': 17 }, g), g);
    });
    const ry = 650;
    for (let m = 0; m <= 20; m += 2) {
      const x = TX0 + (m / 20) * (TX1 - TX0);
      el('line', { x1: x, y1: ry, x2: x, y2: ry + 9, stroke: '#64748b', 'stroke-width': 1.6 }, g);
      txt(x, ry + 26, m, { class: 'small', 'text-anchor': 'middle' }, g);
    }
    txt(TX1 + 22, ry + 26, 'm', { class: 'small' }, g);
  },
  renderLive(s) {
    this.reveals.forEach(d => {
      const ref = s.refs.reveals[d.id];
      if (ref.content.classList.contains('open')) ref.content.innerHTML = d.html(s);
    });
  },
  onReset() {}
};

/* ================= SCÈNE 2 — Trajectoire courbe ================= */
const PATH_D = 'M 100 420 C 220 420 220 200 380 200 C 540 200 540 420 660 420';
const V2 = 1.8, PXPM2 = 50, LANE2_Y = 600;
const scene2 = {
  title: 'Scène 2 — Un objet suit une trajectoire courbe',
  quote: 'Et si la trajectoire était un cercle ? Comment mesurer la distance parcourue par un point qui tourne autour d\'un centre ?',
  reveals: [
    { id: 's', label: 'Révéler la longueur de la trajectoire s', html(s) { return `<div class="formula">s ≈ ${fmt(s.totalLenM, 1)} m</div>`; } },
    { id: 't', label: 'Révéler la durée du parcours Δt', html(s) { return `<div class="formula">Δt = s / v ≈ ${fmt(s.totalLenM / V2, 1)} s</div>`; } },
    { id: 'f', label: 'Révéler la formule de la vitesse moyenne', html(s) {
      const t = s.totalLenM / V2;
      return `<div class="formula">v<sub>moy</sub> = s / Δt = ${fmt(s.totalLenM, 1)} / ${fmt(t, 1)} ≈ ${fmt(s.totalLenM / t, 1)} m/s</div><p>Même méthode que pour la trajectoire rectiligne : on divise la distance <b>réellement parcourue</b> par la durée.</p>`;
    } }
  ],
  tools: [
    { id: 'fil', label: '🧵 Afficher le fil sur la piste', onClick(s) { s.filOn = !s.filOn; } },
    { id: 'unroll', label: '📏 Dérouler et mesurer', onClick(s) { s.unrollTarget = s.unrollTarget > 0.5 ? 0 : 1; } }
  ],
  initState() { return { simTime: 0, playing: false, filOn: false, unroll: 0, unrollTarget: 0, totalLenM: 0, tA: null, tB: null, refs: null }; },
  tick(s, dt) {
    s.simTime += dt;
    if (s.totalLenM) {
      const traveledM = Math.min(s.totalLenM, V2 * s.simTime);
      if (s.tA === null && traveledM >= s.sA) s.tA = s.simTime;
      if (s.tB === null && traveledM >= s.sB) s.tB = s.simTime;
      if (V2 * s.simTime >= s.totalLenM) s.playing = false;
    }
  },
  buildPanel(container, state) {
    state.refs = { toolBtns: buildTools(container, this.tools, state), reveals: buildReveals(container, this.reveals), abCard: el2('div', { class: 'card' }, container) };
  },
  renderBoard(s, g) {
    g.innerHTML = '';
    el('path', { d: PATH_D, fill: 'none', stroke: '#cbd5e1', 'stroke-width': 6 }, g);
    const basePath = el('path', { d: PATH_D, fill: 'none', stroke: 'none' }, g);
    const totalLenPx = basePath.getTotalLength();
    s.totalLenPx = totalLenPx; s.totalLenM = totalLenPx / PXPM2;
    s.sA = 0; s.sB = s.totalLenM;   // A = début de la piste, B = fin de la piste
    const traveledM = Math.min(s.totalLenM, V2 * s.simTime);

    const curveFn = sM => { const p = basePath.getPointAtLength(Math.min(totalLenPx, sM * PXPM2)); return [p.x, p.y]; };
    const showLane = s.filOn || (s.unroll || 0) > 0.01;
    // même échelle que la courbe : la ficelle gardera exactement sa longueur une fois tendue
    const pos = drawUnrollLane(g, { curveFn, totalM: s.totalLenM, unrollT: s.unroll, rulerX0: 90, rulerY: LANE2_Y, pxPerM: PXPM2, color: '#ea580c', draw: showLane, step: 0.25, labelDy: -42 });

    if (!showLane) {
      const progress = el('path', { d: PATH_D, fill: 'none', stroke: '#dc2626', 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
      progress.setAttribute('stroke-dasharray', `${totalLenPx} ${totalLenPx}`);
      progress.setAttribute('stroke-dashoffset', totalLenPx - traveledM * PXPM2);
    }
    // repères A et B
    [['A', s.sA, s.tA], ['B', s.sB, s.tB]].forEach(([name, sM, tCross]) => {
      const [x, y] = pos(sM);

      el('circle', { cx: mx, cy: my, r: 13, fill: colM, stroke: '#fff', 'stroke-width': 3 }, g);
      txt(mx, my - 20, 'M', { class: 'lbl', 'font-size': 20, fill: colM, 'text-anchor': 'middle' }, g);
    }
    // la valeur de l'angle est toujours notée, comme en scène 5
    const aStr = angleUnit === 'deg' ? fmtDeg(th) : fmtRad(th) + ' rad';
    const ra = 55;
    if (th > 0.02) {
      el('path', { d: arcPath(0, th % (2 * Math.PI) === 0 && th > 0 ? 2 * Math.PI - 0.001 : th, ra), stroke: '#7c3aed', 'stroke-width': 3, fill: 'none', 'marker-end': 'url(#arrTheta)' }, g);
      const [tx, ty] = P((th % (2 * Math.PI)) / 2, ra + 26);
      withBg(txt(tx, ty + 8, 'θ = ' + aStr, { class: 'lbl', fill: '#7c3aed', 'text-anchor': 'middle' }, g), g);
    }
  },
  renderLive(s) {
    Object.entries(s.refs.toolBtns).forEach(([id, b]) => {
      if (id === 'trace') b.classList.toggle('active', s.traceOn);
      if (id === 'mesurer') b.classList.toggle('active', s.mesurerOn);
      if (id === 'showM') b.classList.toggle('active', s.showM);
    });
    s.refs.mCard.classList.toggle('hide', !s.showM);
    s.refs.liveTable.classList.toggle('hide', !s.mesurerOn);
    if (s.mesurerOn) {
      const th = s.rawTheta;
      const rows = PTS4.map(p => `<tr><td style="color:${COL[p.id]};font-weight:700">${p.id}</td><td>${fmt(p.r, 2)}</td><td><b>${fmt(p.r * th, 3)}</b></td></tr>`).join('');
      const mRow = s.showM ? `<tr><td style="color:#7c3aed;font-weight:700">M</td><td>${fmt(s.R, 2)}</td><td><b>${fmt(s.R * th, 3)}</b></td></tr>` : '';
      s.refs.liveTable.innerHTML = `<h2>Même θ, s différent</h2>
        <table class="mini"><tr><th>Point</th><th>r (m)</th><th>s = r×θ (m)</th></tr>${rows}${mRow}</table>
        <p style="margin-top:8px">Même θ pour tous ⇒ <b>même ω = Δθ/Δt</b>. Mais s = r×θ diffère ⇒ <b>v = r×ω diffère</b>.</p>`;
    }
    this.reveals.forEach(d => { const ref = s.refs.reveals[d.id]; if (ref.content.classList.contains('open')) ref.content.innerHTML = d.html(s); });
  },
  onReset(s) { s.traceReset = 0; s.refs.rSlider.value = 0.5; }
};

/* ================= Shell : navigation, transport, boucle ================= */
const scenes = [scene1, scene2, scene3, scene4, scene5, scene6];
const sceneStates = scenes.map(s => s.initState());
const panelsBuilt = [false, false, false, false, false, false];
let current = 0, globalSpeed = 1;

function ensurePanel(i) {
  if (panelsBuilt[i]) return;
  const wrap = el2('div', { id: 'panel' + i, class: 'scenePanel' }, $('panels'));
  scenes[i].buildPanel(wrap, sceneStates[i]);
  panelsBuilt[i] = true;
}
function syncPlayLabel() {
  const s = sceneStates[current];
  $('playBtn').textContent = s.playing ? '⏸ Pause' : (s.simTime > 0 ? '▶ Reprendre' : '▶ Démarrer');
}
function buildProgress() {
  const p = $('progress'); p.innerHTML = '';
  scenes.forEach((sc, i) => {
    const seg = el2('div', { class: 'seg' }, p);
    seg.addEventListener('click', () => goTo(i));
    p._segs = p._segs || []; p._segs.push(seg);
  });
}
function updateProgress() {
  $('progress')._segs.forEach((seg, i) => {
    seg.classList.toggle('active', i === current);
    seg.classList.toggle('done', i < current);
  });
}
function goTo(i) {
  current = Math.max(0, Math.min(scenes.length - 1, i));
  ensurePanel(current);
  document.querySelectorAll('.scenePanel').forEach((p, idx) => p.classList.toggle('hide', idx !== current));
  $('sceneTitle').textContent = scenes[current].title;
  $('quote').textContent = scenes[current].quote || '';
  $('prevBtn').disabled = current === 0;
  $('nextBtn').disabled = current === scenes.length - 1;
  updateProgress();
  syncPlayLabel();
  $('chrono').textContent = 'Δt = ' + fmt(sceneStates[current].simTime, 1) + ' s';
}

$('playBtn').addEventListener('click', () => { const s = sceneStates[current]; s.playing = !s.playing; syncPlayLabel(); });
$('resetBtn').addEventListener('click', () => {
  const sc = scenes[current], s = sceneStates[current];
  const refs = s.refs;
  const fresh = sc.initState();
  Object.keys(s).forEach(k => delete s[k]);
  Object.assign(s, fresh, { refs });
  document.querySelectorAll('#panel' + current + ' .reveal button').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('#panel' + current + ' .reveal .content').forEach(c => c.classList.remove('open'));
  if (sc.onReset) sc.onReset(s);
  syncPlayLabel();
});
document.querySelectorAll('#speedRow button').forEach(b => b.addEventListener('click', () => {
  globalSpeed = +b.dataset.sp;
  document.querySelectorAll('#speedRow button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
}));
$('prevBtn').addEventListener('click', () => goTo(current - 1));
$('nextBtn').addEventListener('click', () => goTo(current + 1));
$('fs').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); $('playBtn').click(); }
  else if (k === 'arrowright') goTo(current + 1);
  else if (k === 'arrowleft') goTo(current - 1);
  else if (k === 'f') $('fs').click();
});

let last = performance.now();
function loop(now) {
  const dtReal = Math.min(0.05, (now - last) / 1000);
  last = now;
  const sc = scenes[current], s = sceneStates[current];
  const dtSim = dtReal * globalSpeed;
  if (s.playing) sc.tick(s, dtSim);
  if (s.unrollTarget !== undefined) {
    const step = dtReal / 1.3;
    const diff = s.unrollTarget - (s.unroll || 0);
    s.unroll = (s.unroll || 0) + Math.sign(diff) * Math.min(Math.abs(diff), step);
  }
  sc.renderBoard(s, $('board-g'));
  if (s.refs) sc.renderLive(s);
  $('chrono').textContent = 'Δt = ' + fmt(s.simTime, 1) + ' s';
  if (!s.playing) syncPlayLabel();
  requestAnimationFrame(loop);
}

buildProgress();
goTo(0);
requestAnimationFrame(loop);
</script>
</body>
