<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repérage angulaire</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1d2433; --muted:#5b6475;
    --grid:#cfd6e3; --grid2:#e9edf4; --axis:#1d2433;
    --accent:#2563eb; --ok:#15803d; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2;
    --info:#1e40af; --infobg:#dbeafe; --pt:#e11d48; --proj:#7c3aed; --theta:#ea580c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:19px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px}
  h1{font-size:1.35em;margin:0}
  .sub{color:var(--muted);font-size:.8em;margin-top:2px}
  main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:0 16px 16px;height:calc(100vh - 72px)}
  .board{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
  svg{width:100%;height:100%;display:block}
  .panel{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
  .card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:14px 16px}
  .card h2{font-size:.85em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
  button{font:inherit;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:#e7ebf3;color:var(--ink)}
  button:hover{filter:brightness(.96)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button:disabled{opacity:.35;cursor:default;filter:none}
  .primary{background:var(--accent);color:#fff;font-weight:600}
  .big{width:100%;font-size:1.15em;padding:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row > button{flex:1}
  .sys button{font-size:1.25em;font-weight:700;padding:12px 6px}
  .sys button.active,.levels button.active{background:var(--accent);color:#fff}
  .levels button{flex:1;padding:8px 6px;font-size:.85em}
  .lvl-desc{color:var(--muted);font-size:.8em;margin-top:8px}
  .coords{display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.7em;font-weight:600;margin:14px 0 12px}
  .coords input{width:3.6em;font:inherit;text-align:center;padding:6px 4px;border:2px solid var(--grid);border-radius:10px;background:#fbfcfe;color:var(--ink)}
  .coords input.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--infobg)}
  .coords input.good{border-color:var(--ok);background:var(--okbg);box-shadow:none}
  .coords input.wrong{border-color:var(--bad);background:var(--badbg);box-shadow:none}
  .keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .keypad button{font-size:1.45em;font-weight:600;padding:12px 0;background:#eef1f7;touch-action:manipulation;user-select:none}
  .keypad button:active{background:#d6dcea;transform:scale(.97)}
  .keypad .op{background:#e0e7ff;color:#3730a3}
  .keypad .del{background:#fde2e2;color:#b91c1c;font-size:1.15em}
  .keypad .next{background:#dbeafe;color:var(--accent);font-size:1.05em}
  .keypad .zero{grid-column:span 2}
  .msg{border-radius:12px;padding:10px 12px;font-size:1em;margin-top:10px;display:none;line-height:1.4}
  .msg.ok{display:block;background:var(--okbg);color:var(--ok)}
  .msg.bad{display:block;background:var(--badbg);color:var(--bad)}
  .msg.info{display:block;background:var(--infobg);color:var(--info)}
  .score{display:flex;justify-content:space-around;text-align:center}
  .score b{display:block;font-size:1.8em}
  .score span{color:var(--muted);font-size:.8em}
  /* SVG */
  .layer{transition:opacity .9s ease}
  .minor{stroke:var(--grid2);stroke-width:1}
  .major{stroke:var(--grid);stroke-width:1.2}
  .ring{stroke:var(--grid);stroke-width:1.4;fill:none}
  .ray{stroke:var(--grid);stroke-width:1.2}
  .axis{stroke:var(--axis);stroke-width:2.2}
  .tick{stroke:var(--axis);stroke-width:2}
  .num{font-size:16px;fill:var(--muted)}
  .deg{font-size:16px;font-weight:600;fill:#64748b}
  .axlbl{font-size:22px;font-style:italic;font-weight:600;fill:var(--axis)}
  .ptlbl{font-size:26px;font-weight:700;fill:var(--pt)}
  .projline{stroke-width:2.5;stroke-dasharray:7 6;fill:none}
  .val{font-size:19px;font-weight:700}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.5)}100%{transform:scale(1)}}
  .halo{transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-out infinite}
  @keyframes halo{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
  @media (max-width:900px){
    main{grid-template-columns:1fr;height:auto}
    .board{aspect-ratio:1/1}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Repérer un point : (x ; y) ou (r ; θ)</h1>
    <div class="sub">Le même point, deux façons de le repérer.</div>
  </div>
  <button id="fs" title="Plein écran (F)">⛶ Plein écran</button>
</header>

<main>
  <div class="board">
    <svg id="svg" viewBox="0 0 600 600" aria-label="Repère">
      <defs>
        <marker id="arrAxis" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/>
        </marker>
        <marker id="arrTheta" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
        </marker>
      </defs>
      <g id="gCart" class="layer"></g>
      <g id="gPolar" class="layer"></g>
      <g id="gAxes"></g>
      <g id="dyn"></g>
    </svg>
  </div>

  <div class="panel">
    <div class="card">
      <h2>Repère</h2>
      <div class="row sys" id="sys">
        <button data-s="cart" class="active">(x ; y)</button>
        <button data-s="polar">(r ; θ)</button>
      </div>
    </div>

    <div class="card">
      <h2>Niveau</h2>
      <div class="row levels" id="levels">
        <button data-l="1">1</button>
        <button data-l="2" class="active">2</button>
        <button data-l="3">3</button>
        <button data-l="4">4</button>
      </div>
      <div class="lvl-desc" id="lvlDesc"></div>
    </div>

    <div class="card">
      <button class="primary big" id="newBtn">✨ Nouveau point</button>
      <div class="coords">
        <span id="ptName">M</span>
        <span>(</span>
        <input id="in1" type="text" inputmode="none" autocomplete="off">
        <span>;</span>
        <input id="in2" type="text" inputmode="none" autocomplete="off">
        <span id="unit2"></span>
        <span>)</span>
      </div>
      <div class="keypad" id="keypad">
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="back" class="del" title="Effacer le dernier chiffre">⌫</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="clear" class="del" title="Effacer la case">C</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="-" class="op" id="minusKey" title="Signe moins">−</button>
        <button data-k="0" class="zero">0</button><button data-k="," class="op" title="Virgule">,</button><button data-k="next" class="next" id="nextKey">➜</button>
      </div>
      <div class="row">
        <button class="primary" id="checkBtn">✔ Vérifier</button>
        <button id="revealBtn">👁 Révéler</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card">
      <h2>Score</h2>
      <div class="score">
        <div><b id="sOk">0</b><span>réussis</span></div>
        <div><b id="sFirst">0</b><span>du 1er coup</span></div>
        <div><b id="sTot">0</b><span>points</span></div>
      </div>
      <div class="row" style="margin-top:10px"><button id="resetBtn">↺ Remettre à zéro</button></div>
    </div>
  </div>
</main>

<script>
const NS = 'http://www.w3.org/2000/svg';
const S = 600, C = 300, PAD = 40, R = 6, U = (S - 2 * PAD) / (2 * R), DEG = Math.PI / 180;
const X = x => C + x * U;
const Y = y => C - y * U;
const P = (r, th) => [X(r * Math.cos(th * DEG)), Y(r * Math.sin(th * DEG))];   // th en degrés
const $ = id => document.getElementById(id);

const LEVELS = {
  cart:  { 1: 'Entiers positifs', 2: 'Entiers positifs ou négatifs', 3: 'Au demi près', 4: 'Sans quadrillage' },
  polar: { 1: 'θ multiple de 90°', 2: 'θ multiple de 45°', 3: 'θ multiple de 30°', 4: 'θ multiple de 15°' }
};
const STEP = { 1: 90, 2: 45, 3: 30, 4: 15 };
const NAMES = ['M', 'A', 'B', 'C', 'D', 'E', 'N', 'P'];

let sys = 'cart', level = 2, pt = null, tries = 0, done = false, active = 'in1';
let view = {};
const score = { ok: 0, first: 0, tot: 0 };

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(x, y, s, attrs, parent) {
  const t = el('text', Object.assign({ x, y }, attrs), parent);
  t.textContent = s;
  return t;
}
function withBg(t, parent) {
  const b = t.getBBox();
  parent.insertBefore(el('rect', { x: b.x - 5, y: b.y - 2, width: b.width + 10, height: b.height + 4, rx: 6, fill: '#fff', opacity: .92 }), t);
}
const round1 = n => Math.round(n * 10) / 10;
const fmt = n => (Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : round1(n).toFixed(1)).replace('.', ',').replace('-', '−');
const fmtA = th => fmt(th) + '°';
const norm360 = a => ((a % 360) + 360) % 360;

/* ---------- Quadrillages ---------- */
function drawGrids() {
  const gc = $('gCart'), gp = $('gPolar'), ga = $('gAxes');
  gc.innerHTML = gp.innerHTML = ga.innerHTML = '';

  if (level === 3) {
    for (let k = -2 * R + 1; k < 2 * R; k += 2) {
      el('line', { x1: X(k / 2), y1: Y(-R), x2: X(k / 2), y2: Y(R), class: 'minor' }, gc);
      el('line', { x1: X(-R), y1: Y(k / 2), x2: X(R), y2: Y(k / 2), class: 'minor' }, gc);
    }
  }
  if (level !== 4) {
    for (let v = -R; v <= R; v++) {
      if (v === 0) continue;
      el('line', { x1: X(v), y1: Y(-R), x2: X(v), y2: Y(R), class: 'major' }, gc);
      el('line', { x1: X(-R), y1: Y(v), x2: X(R), y2: Y(v), class: 'major' }, gc);
    }
  }

  for (let r = 1; r <= R; r++) el('circle', { cx: C, cy: C, r: r * U, class: 'ring' }, gp);
  const step = STEP[level];
  for (let a = 0; a < 360; a += step) {
    const [x, y] = P(R, a);
    if (a % 90) el('line', { x1: C, y1: C, x2: x, y2: y, class: 'ray' }, gp);
  }
  const lstep = Math.max(step, 30);
  for (let a = 0; a < 360; a += (level === 2 ? 45 : lstep)) {
    const [x, y] = P(R - 0.55, a % 90 ? a : a + 7);   // décalé pour ne pas cacher les graduations des axes
    withBg(txt(x, y + 6, a + '°', { class: 'deg', 'text-anchor': 'middle' }, gp), gp);
  }

  el('line', { x1: X(-R) - 10, y1: Y(0), x2: X(R) + 22, y2: Y(0), class: 'axis', 'marker-end': 'url(#arrAxis)' }, ga);
  el('line', { x1: X(0), y1: Y(-R) + 10, x2: X(0), y2: Y(R) - 22, class: 'axis', 'marker-end': 'url(#arrAxis)' }, ga);
  for (let v = -R; v <= R; v++) {
    if (v === 0) continue;
    el('line', { x1: X(v), y1: Y(0) - 5, x2: X(v), y2: Y(0) + 5, class: 'tick' }, ga);
    el('line', { x1: X(0) - 5, y1: Y(v), x2: X(0) + 5, y2: Y(v), class: 'tick' }, ga);
    txt(X(v), Y(0) + 22, fmt(v), { class: 'num', 'text-anchor': 'middle' }, ga);
    txt(X(0) - 10, Y(v) + 5, fmt(v), { class: 'num', 'text-anchor': 'end' }, ga);
  }
  txt(X(0) - 12, Y(0) + 22, 'O', { class: 'axlbl', 'text-anchor': 'end' }, ga);
  txt(X(R) + 10, Y(0) - 12, 'x', { class: 'axlbl' }, ga);
  txt(X(0) + 12, Y(R) - 6, 'y', { class: 'axlbl' }, ga);
  showLayers();
}
function showLayers() {
  $('gCart').style.opacity = sys === 'cart' ? 1 : 0;
  $('gPolar').style.opacity = sys === 'polar' ? 1 : 0;
}

/* ---------- Le point et ses aides ---------- */
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function fromXY(x, y) { return { x, y, r: Math.hypot(x, y), th: norm360(Math.atan2(y, x) / DEG) }; }
function fromRTh(r, th) {
  const clean = v => Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v) : v;
  return { r, th, x: clean(r * Math.cos(th * DEG)), y: clean(r * Math.sin(th * DEG)) };
}

function generate() {
  let p;
  do {
    if (sys === 'polar') {
      const step = STEP[level];
      p = fromRTh(randInt(1, 5), randInt(0, 360 / step - 1) * step);
    } else {
      let x, y;
      if (level === 1) { x = randInt(1, 5); y = randInt(1, 5); }
      else if (level === 3) {
        do { x = randInt(-10, 10) / 2; y = randInt(-10, 10) / 2; } while (Number.isInteger(x) && Number.isInteger(y));
      } else { x = randInt(-5, 5); y = randInt(-5, 5); }
      p = fromXY(x, y);
    }
  } while (p.r < 1e-9 || (pt && Math.abs(pt.x - p.x) < 1e-9 && Math.abs(pt.y - p.y) < 1e-9));
  p.name = NAMES[randInt(0, NAMES.length - 1)];
  return p;
}

function drawCartHelp(p, color, values, g) {
  el('path', { d: `M${X(p.x)},${Y(p.y)} L${X(p.x)},${Y(0)}`, class: 'projline', stroke: color }, g);
  el('path', { d: `M${X(p.x)},${Y(p.y)} L${X(0)},${Y(p.y)}`, class: 'projline', stroke: color }, g);
  el('circle', { cx: X(p.x), cy: Y(0), r: 6, fill: color }, g);
  el('circle', { cx: X(0), cy: Y(p.y), r: 6, fill: color }, g);
  if (!values) return;
  withBg(txt(X(p.x), p.y >= 0 ? Y(0) + 46 : Y(0) - 30, `x = ${fmt(p.x)}`, { class: 'val', fill: color, 'text-anchor': 'middle' }, g), g);
  withBg(txt(p.x >= 0 ? X(0) - 44 : X(0) + 44, Y(p.y) + 6, `y = ${fmt(p.y)}`,
    { class: 'val', fill: color, 'text-anchor': p.x >= 0 ? 'end' : 'start' }, g), g);
}

function drawPolarHelp(p, color, values, g) {
  el('circle', { cx: C, cy: C, r: p.r * U, fill: 'none', stroke: color, 'stroke-width': 3, 'stroke-dasharray': '8 6' }, g);
  const [mx, my] = P(p.r, p.th);
  el('line', { x1: C, y1: C, x2: mx, y2: my, stroke: color, 'stroke-width': 3.5 }, g);
  if (p.th > 0.05) {
    const ra = 38, [ex, ey] = P(ra / U, p.th);
    el('path', { d: `M${C + ra},${C} A${ra},${ra} 0 ${p.th > 180 ? 1 : 0} 0 ${ex},${ey}`,
      stroke: 'var(--theta)', 'stroke-width': 3.5, fill: 'none', 'marker-end': 'url(#arrTheta)' }, g);
  }
  if (!values) return;
  const [tx, ty] = P((38 + 34) / U, p.th / 2);
  withBg(txt(tx, ty + 7, `θ = ${fmtA(p.th)}`, { class: 'val', fill: 'var(--theta)', 'text-anchor': 'middle' }, g), g);
  // r écrit à côté du segment OM
  const [hx, hy] = P(p.r * 0.62, p.th), nx = -Math.sin(p.th * DEG), ny = -Math.cos(p.th * DEG);
  withBg(txt(hx + nx * 22, hy + ny * 22 + 6, `r = ${fmt(p.r)}`, { class: 'val', fill: color, 'text-anchor': 'middle' }, g), g);
}

function drawPoint(p, g) {
  el('circle', { cx: X(p.x), cy: Y(p.y), r: 9, fill: 'none', stroke: 'var(--pt)', 'stroke-width': 3, class: 'halo' }, g);
  el('circle', { cx: X(p.x), cy: Y(p.y), r: 9, fill: 'var(--pt)', stroke: '#fff', 'stroke-width': 2.5, class: 'pop' }, g);
  const dx = p.x >= 0 ? 14 : -14, dy = p.y >= 0 ? -14 : 30;
  txt(X(p.x) + dx, Y(p.y) + dy, p.name, { class: 'ptlbl', 'text-anchor': p.x >= 0 ? 'start' : 'end' }, g);
}

function render(v) {
  view = v;
  const g = $('dyn');
  g.innerHTML = '';
  if (!pt) return;
  if (v.ghost) {
    const q = v.ghost;
    if (Math.abs(q.x) <= R && Math.abs(q.y) <= R) {
      el('circle', { cx: X(q.x), cy: Y(q.y), r: 10, fill: 'none', stroke: 'var(--bad)', 'stroke-width': 3, 'stroke-dasharray': '4 3' }, g);
      txt(X(q.x) + 14, Y(q.y) + 28, 'réponse', { 'font-size': 15, fill: 'var(--bad)', 'font-weight': 600 }, g);
    }
  }
  const finished = v.solved || v.revealed;
  const color = v.solved ? 'var(--ok)' : 'var(--proj)';
  if (v.compare || (finished && sys === 'cart')) drawCartHelp(pt, v.compare ? 'var(--proj)' : color, true, g);
  else if (v.hint && sys === 'cart') drawCartHelp(pt, 'var(--proj)', false, g);
  if (v.compare || (finished && sys === 'polar')) drawPolarHelp(pt, v.compare ? 'var(--accent)' : color, true, g);
  else if (v.hint && sys === 'polar') drawPolarHelp(pt, 'var(--proj)', false, g);
  drawPoint(pt, g);
}

/* ---------- Questions et réponses ---------- */
function setMsg(kind, html) { const m = $('msg'); m.className = 'msg ' + kind; m.innerHTML = html; }
function clearMsg() { $('msg').className = 'msg'; }
const ans = p => sys === 'cart' ? `${p.name}(${fmt(p.x)} ; ${fmt(p.y)})` : `${p.name}(${fmt(p.r)} ; ${fmtA(p.th)})`;

function parse(s) {
  s = s.trim().replace(',', '.').replace('−', '-').replace(/[\s°]/g, '');
  if (s === '' || isNaN(Number(s))) return null;
  return Number(s);
}

function clearInputs() { ['in1', 'in2'].forEach(id => { $(id).value = ''; $(id).className = ''; }); setActive('in1'); }

function newPoint() {
  pt = generate();
  tries = 0; done = false;
  score.tot++; updateScore();
  $('ptName').textContent = pt.name;
  clearInputs(); clearMsg();
  render({});
}

function check() {
  if (!pt) { newPoint(); return; }
  if (done) return;
  const a = parse($('in1').value), b = parse($('in2').value);
  if (a === null || b === null) { setMsg('info', sys === 'cart' ? 'Écrivez x et y.' : 'Écrivez r et θ.'); return; }
  tries++;
  let ok1, ok2, ghost;
  if (sys === 'cart') {
    ok1 = Math.abs(a - pt.x) < 1e-9; ok2 = Math.abs(b - pt.y) < 1e-9;
    ghost = { x: a, y: b };
  } else {
    ok1 = Math.abs(a - pt.r) < 0.05;
    const d = norm360(b - pt.th);
    ok2 = d < 0.5 || d > 359.5;
    ghost = a > 0 ? fromRTh(a, b) : null;
  }
  $('in1').className = ok1 ? 'good' : 'wrong';
  $('in2').className = ok2 ? 'good' : 'wrong';

  if (ok1 && ok2) {
    done = true;
    score.ok++; if (tries === 1) score.first++;
    updateScore();
    setMsg('ok', `🎉 ${tries === 1 ? 'Bravo, du premier coup !' : 'Bravo !'} <b>${ans(pt)}</b>`);
    render({ solved: true });
    return;
  }

  let advice;
  if (sys === 'cart') {
    if (!ok1 && !ok2 && Math.abs(a - pt.y) < 1e-9 && Math.abs(b - pt.x) < 1e-9) advice = '🔄 x et y inversés : on écrit (x ; y).';
    else if ((!ok1 && Math.abs(a + pt.x) < 1e-9) || (!ok2 && Math.abs(b + pt.y) < 1e-9)) advice = '➖ Attention au signe.';
    else if (!ok1 && ok2) advice = '✘ x est faux.';
    else if (ok1 && !ok2) advice = '✘ y est faux.';
    else advice = '✘ x et y sont faux.';
  } else {
    if (!ok2 && pt.th % 180 !== 0 && Math.abs(norm360(360 - b) - pt.th) < 0.5) advice = '↺ θ se compte dans l\'autre sens.';
    else if (!ok1 && ok2) advice = '✘ r est faux : r = OM.';
    else if (ok1 && !ok2) advice = '✘ θ est faux : on part de l\'axe (Ox).';
    else advice = '✘ r et θ sont faux.';
  }
  const hint = tries >= 2;
  if (hint) advice += '<br>💡 Aide en pointillés.';
  setMsg('bad', advice);
  render({ ghost, hint });
}

function reveal() {
  if (!pt || done) return;
  done = true;
  if (sys === 'cart') { $('in1').value = fmt(pt.x); $('in2').value = fmt(pt.y); }
  else { $('in1').value = fmt(pt.r); $('in2').value = fmt(pt.th); }
  setMsg('info', `<b>${ans(pt)}</b>`);
  render({ revealed: true });
}

function updateScore() {
  $('sOk').textContent = score.ok;
  $('sFirst').textContent = score.first;
  $('sTot').textContent = score.tot;
}

/* ---------- Changement de repère : le même point, deux écritures ---------- */
function setSys(s) {
  if (s === sys) return;
  sys = s;
  document.querySelectorAll('#sys button').forEach(b => b.classList.toggle('active', b.dataset.s === s));
  $('lvlDesc').textContent = LEVELS[sys][level];
  $('unit2').textContent = s === 'polar' ? '°' : '';
  $('in1').setAttribute('aria-label', s === 'cart' ? 'x' : 'r');
  $('in2').setAttribute('aria-label', s === 'cart' ? 'y' : 'θ en degrés');
  $('in1').placeholder = s === 'cart' ? 'x' : 'r';
  $('in2').placeholder = s === 'cart' ? 'y' : 'θ';
  $('minusKey').disabled = s === 'polar';
  drawGrids();
  clearInputs();
  if (pt) {
    done = true;
    setMsg('info', `Même point :<br><b>${pt.name}(${fmt(pt.x)} ; ${fmt(pt.y)})</b> &nbsp;=&nbsp; <b>${pt.name}(${fmt(pt.r)} ; ${fmtA(pt.th)})</b>`);
    render({ compare: true });
  }
}

function setLevel(l) {
  level = l;
  document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('active', +b.dataset.l === l));
  $('lvlDesc').textContent = LEVELS[sys][l];
  drawGrids();
  if (pt) newPoint();
}

/* ---------- Clavier à l'écran ---------- */
function setActive(id) {
  active = id;
  $('in1').classList.toggle('active', id === 'in1');
  $('in2').classList.toggle('active', id === 'in2');
  const [a, b] = sys === 'cart' ? ['x', 'y'] : ['r', 'θ'];
  $('nextKey').textContent = id === 'in1' ? b + ' ➜' : '⬅ ' + a;
}
function pressKey(k) {
  if (k === 'next') { setActive(active === 'in1' ? 'in2' : 'in1'); return; }
  if (done) return;
  const inp = $(active);
  let v = inp.value.replace('-', '−').replace('.', ',');
  if (k === 'back') v = v.slice(0, -1);
  else if (k === 'clear') v = '';
  else if (k === '-') v = v.startsWith('−') ? v.slice(1) : '−' + v;
  else if (k === ',') { if (!v.includes(',')) v = (v === '' || v === '−' ? v + '0' : v) + ','; }
  else if (v.replace('−', '').replace(',', '').length < 4) v = (v === '0' ? '' : v === '−0' ? '−' : v) + k;
  inp.value = v;
  inp.className = 'active';
}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

document.querySelectorAll('#sys button').forEach(b => b.addEventListener('click', () => setSys(b.dataset.s)));
document.querySelectorAll('#levels button').forEach(b => b.addEventListener('click', () => setLevel(+b.dataset.l)));
document.querySelectorAll('#keypad button').forEach(b => {
  b.addEventListener('pointerdown', e => e.preventDefault());
  b.addEventListener('click', () => pressKey(b.dataset.k));
});
$('newBtn').addEventListener('click', newPoint);
$('checkBtn').addEventListener('click', check);
$('revealBtn').addEventListener('click', reveal);
$('fs').addEventListener('click', toggleFullscreen);
$('resetBtn').addEventListener('click', () => { score.ok = score.first = score.tot = 0; updateScore(); });
['in1', 'in2'].forEach(id => {
  $(id).addEventListener('focus', () => setActive(id));
  $(id).addEventListener('click', () => setActive(id));
  $(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); if (done) newPoint(); else check(); }
    else if (e.key === ';' && id === 'in1') { e.preventDefault(); $('in2').focus(); }
  });
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (e.target.tagName === 'BUTTON' && (k === 'enter' || k === ' ')) return;
  if (k === 'n') newPoint();
  else if (k === 'r') reveal();
  else if (k === 'f') toggleFullscreen();
  else if (k === 'enter') { done || !pt ? newPoint() : check(); }
});

setLevel(2);
setActive('in1');
$('in1').placeholder = 'x'; $('in2').placeholder = 'y';
</script>
</body>
</html>
