<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abscisse curviligne</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1d2433; --muted:#5b6475;
    --grid:#cfd6e3; --axis:#1d2433;
    --accent:#2563eb; --ok:#15803d; --okbg:#dcfce7;
    --info:#1e40af; --infobg:#dbeafe; --pt:#e11d48; --fil:#ea580c; --fil2:#fdba74;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:19px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px}
  h1{font-size:1.35em;margin:0}
  main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding:0 16px 16px;height:calc(100vh - 64px)}
  .board{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
  svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:pointer}
  .panel{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
  .card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:14px 16px}
  .card h2{font-size:.85em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
  button{font:inherit;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:#e7ebf3;color:var(--ink)}
  button:hover{filter:brightness(.96)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .primary{background:var(--accent);color:#fff;font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row > button{flex:1}
  .slider{display:flex;align-items:center;gap:12px;font-size:1.15em;font-weight:600}
  .slider input{flex:1;accent-color:var(--accent);height:28px}
  .live{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;font-size:1.3em}
  .live .k{font-weight:700}
  .live .v{font-weight:700;font-variant-numeric:tabular-nums}
  .live .ratio{color:var(--fil)}
  .live .rad{color:var(--ok)}
  .hide{display:none !important}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95em}
  th,td{padding:5px 4px;text-align:center;border-bottom:1px solid #e9edf4}
  th{font-size:.8em;color:var(--muted)}
  td.ratio{color:var(--fil);font-weight:700}
  td.rad{color:var(--ok);font-weight:700}
  .empty{color:var(--muted);text-align:center;font-size:.85em;padding:8px 0}
  .formula{margin-top:12px;border-radius:12px;background:var(--okbg);color:var(--ok);text-align:center;padding:12px;font-size:1.35em;font-weight:700;line-height:1.5}
  .dares button{font-weight:700}
  .dares button.active{background:var(--fil);color:#fff}
  .msg{border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--okbg);color:var(--ok);font-weight:600;text-align:center}
  /* SVG */
  .traj{stroke:#cbd5e1;stroke-width:3;fill:none}
  .axis{stroke:var(--axis);stroke-width:2;opacity:.3}
  .lbl{font-size:22px;font-weight:700}
  .chunk{font-size:20px;font-weight:800}
  @media (max-width:900px){
    main{grid-template-columns:1fr;height:auto}
    .board{aspect-ratio:1/1}
  }
</style>
</head>
<body>
<header>
  <h1>Abscisse curviligne : quel lien entre s, R et θ ?</h1>
  <button id="fs" title="Plein écran (F)">⛶ Plein écran</button>
</header>

<main>
  <div class="board">
    <svg id="svg" viewBox="0 0 600 600" aria-label="Cercle">
      <defs>
        <marker id="arrTheta" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/>
        </marker>
      </defs>
      <g id="dyn"></g>
    </svg>
  </div>

  <div class="panel">
    <div class="card">
      <div class="slider"><span>R</span><input type="range" id="rSlider" min="1" max="4" step="0.5" value="3"><span id="rVal">3 cm</span></div>
    </div>

    <div class="card">
      <div class="live">
        <span class="k">θ</span><span class="v" id="vDeg"></span>
        <span class="k">s</span><span class="v" id="vS"></span>
        <span class="k ratio">s ÷ R</span><span class="v ratio" id="vRatio"></span>
        <span class="k rad hide radCol">θ</span><span class="v rad hide radCol" id="vRad"></span>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="noteBtn">📏 Noter la mesure</button>
      </div>
    </div>

    <div class="card">
      <h2>🎯 Défi : placez M pour que…</h2>
      <div class="row dares" id="dares">
        <button data-n="1">s = R</button>
        <button data-n="2">s = 2R</button>
        <button data-n="3">s = 3R</button>
      </div>
      <div class="msg hide" id="dareMsg"></div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>R (cm)</th><th>θ (°)</th><th>s (cm)</th><th>s ÷ R</th><th class="hide radCol">θ (rad)</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty">Déplacez M, puis notez la mesure.</div>
      <div class="row" style="margin-top:10px">
        <button id="radBtn">θ en radians ?</button>
        <button id="clearBtn">🗑 Effacer</button>
      </div>
      <div class="formula hide" id="formula">s ÷ R = θ (en rad)<br>s = R · θ</div>
    </div>

  </div>
</main>

<script>
const NS = 'http://www.w3.org/2000/svg';
const C = 300, U = 62, DEG = Math.PI / 180;
const $ = id => document.getElementById(id);

let R = 3, deg = 90, showRad = false, dare = 0;
const rows = [];

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(x, y, s, attrs, parent) {
  const t = el('text', Object.assign({ x, y }, attrs), parent);
  t.textContent = s;
  return t;
}
const fmt = (n, d = 2) => n.toFixed(d).replace('.', ',');
const fmtR = r => String(r).replace('.', ',');
const P = (a, r) => [C + r * Math.cos(a), C - r * Math.sin(a)];   // a en radians, r en pixels
function arc(a1, a2, r) {
  const [x1, y1] = P(a1, r), [x2, y2] = P(a2, r);
  return `M${x1},${y1} A${r},${r} 0 ${a2 - a1 > Math.PI ? 1 : 0} 0 ${x2},${y2}`;
}

/* ---------- Dessin ---------- */
function draw() {
  const g = $('dyn');
  g.innerHTML = '';
  const th = deg * DEG, rp = R * U;

  el('line', { x1: C - rp - 30, y1: C, x2: C + rp + 40, y2: C, class: 'axis' }, g);
  el('circle', { cx: C, cy: C, r: rp, class: 'traj' }, g);

  // L'arc M0M découpé en morceaux de longueur R (chaque morceau = 1 rad)
  const n = Math.floor(th + 1e-9);
  for (let i = 0; i < n; i++) {
    el('path', { d: arc(i, i + 1, rp), stroke: i % 2 ? 'var(--fil2)' : 'var(--fil)', 'stroke-width': 9, fill: 'none' }, g);
    const [x, y] = P(i + 0.5, rp + 26);
    txt(x, y + 7, i + 1, { class: 'chunk', fill: 'var(--fil)', 'text-anchor': 'middle' }, g);
  }
  if (th - n > 1e-3)
    el('path', { d: arc(n, th, rp), stroke: n % 2 ? 'var(--fil2)' : 'var(--fil)', 'stroke-width': 9, fill: 'none', opacity: .55 }, g);
  // séparations entre les morceaux
  for (let i = 1; i <= n; i++) {
    const [x1, y1] = P(i, rp - 9), [x2, y2] = P(i, rp + 9);
    el('line', { x1, y1, x2, y2, stroke: '#fff', 'stroke-width': 3 }, g);
  }

  // Le rayon R (même couleur que le premier morceau, pour comparer)
  el('line', { x1: C, y1: C, x2: C + rp, y2: C, stroke: 'var(--fil)', 'stroke-width': 6, 'stroke-linecap': 'round' }, g);
  txt(C + rp / 2, C + 30, 'R', { class: 'lbl', fill: 'var(--fil)', 'text-anchor': 'middle' }, g);

  // OM et l'angle θ
  const [mx, my] = P(th, rp);
  el('line', { x1: C, y1: C, x2: mx, y2: my, stroke: '#64748b', 'stroke-width': 2.5 }, g);
  if (deg > 0) {
    const ra = 30;
    el('path', { d: arc(0, th, ra), stroke: 'var(--axis)', 'stroke-width': 2.5, fill: 'none', 'marker-end': 'url(#arrTheta)' }, g);
    const [tx, ty] = P(th / 2, ra + 20);
    txt(tx, ty + 8, 'θ', { class: 'lbl', fill: 'var(--axis)', 'text-anchor': 'middle' }, g);
  }

  el('circle', { cx: C, cy: C, r: 4, fill: 'var(--axis)' }, g);
  txt(C - 10, C + 26, 'O', { class: 'lbl', 'font-style': 'italic', 'text-anchor': 'end', fill: 'var(--axis)' }, g);
  el('circle', { cx: C + rp, cy: C, r: 8, fill: '#fff', stroke: 'var(--axis)', 'stroke-width': 3 }, g);
  txt(C + rp + 12, C - 12, 'M₀', { class: 'lbl', fill: 'var(--axis)' }, g);
  el('circle', { cx: mx, cy: my, r: 12, fill: 'var(--pt)', stroke: '#fff', 'stroke-width': 3 }, g);
  const [lx, ly] = P(th + 0.16, rp - 32);
  txt(lx, ly + 9, 'M', { class: 'lbl', 'font-size': 26, fill: 'var(--pt)', 'text-anchor': 'middle' }, g);

  update();
}

function update() {
  const th = deg * DEG, s = R * th;
  $('vDeg').textContent = deg + '°';
  $('vS').textContent = fmt(s) + ' cm';
  $('vRatio').textContent = fmt(s / R);
  $('vRad').textContent = fmt(th) + ' rad';
  if (dare) {
    const ok = Math.abs(th - dare) < 0.012;
    $('dareMsg').classList.toggle('hide', !ok);
    if (ok) $('dareMsg').textContent = `🎉 θ = ${deg}° = ${dare} rad`;
  }
}

function renderTable() {
  $('tbody').innerHTML = rows.map(r => `<tr><td>${fmtR(r.R)}</td><td>${r.deg}</td><td>${fmt(r.s)}</td>` +
    `<td class="ratio">${fmt(r.s / r.R)}</td><td class="rad${showRad ? '' : ' hide'} radCol">${fmt(r.deg * DEG)}</td></tr>`).join('');
  $('empty').classList.toggle('hide', rows.length > 0);
}

/* ---------- Interactions ---------- */
const svg = $('svg');
let dragging = false;
function pointerDeg(e) {
  const p = svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  const a = Math.atan2(C - q.y, q.x - C) / DEG;
  return Math.round((a + 360) % 360) % 360;
}
svg.addEventListener('pointerdown', e => { dragging = true; svg.setPointerCapture(e.pointerId); deg = pointerDeg(e); draw(); });
svg.addEventListener('pointermove', e => { if (dragging) { deg = pointerDeg(e); draw(); } });
svg.addEventListener('pointerup', () => { dragging = false; });
svg.addEventListener('pointercancel', () => { dragging = false; });

$('rSlider').addEventListener('input', e => { R = +e.target.value; $('rVal').textContent = fmtR(R) + ' cm'; draw(); });
$('noteBtn').addEventListener('click', () => {
  rows.push({ R, deg, s: R * deg * DEG });
  if (rows.length > 10) rows.shift();
  renderTable();
});
$('clearBtn').addEventListener('click', () => { rows.length = 0; renderTable(); });
$('radBtn').addEventListener('click', () => {
  showRad = !showRad;
  document.querySelectorAll('.radCol').forEach(e => e.classList.toggle('hide', !showRad));
  $('formula').classList.toggle('hide', !showRad);
  $('radBtn').textContent = showRad ? 'Masquer θ (rad)' : 'θ en radians ?';
});
document.querySelectorAll('#dares button').forEach(b => b.addEventListener('click', () => {
  dare = dare === +b.dataset.n ? 0 : +b.dataset.n;
  document.querySelectorAll('#dares button').forEach(x => x.classList.toggle('active', +x.dataset.n === dare));
  $('dareMsg').classList.add('hide');
  update();
}));
$('fs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); deg = (deg + 1) % 360; draw(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); deg = (deg + 359) % 360; draw(); }
  else if (e.key.toLowerCase() === 'f') $('fs').click();
});

draw();
renderTable();
</script>
</body>
</html>
